allowBuilds:
  '@biomejs/biome': true
  core-js: true
  sharp: true

# Security overrides: force patched versions of vulnerable (mostly transitive)
# deps flagged by `pnpm audit` / Dependabot. Each replacement is a caret range
# pinned to the fixed version WITHIN the installed major, so parents that expect
# that major are not broken by an unbounded `>=` pulling a major-version jump.
# hono / @hono/node-server are dev-only (shadcn CLI); the rest are build/runtime.
overrides:
  '@hono/node-server@<1.19.15': ^1.19.15
  baseline-browser-mapping@>=2.0.0 <2.11.0: ^2.11.0
  brace-expansion@>=3.0.0 <5.0.9: ^5.0.9
  browserslist@<4.28.7: ^4.28.7
  dompurify@<3.4.13: ^3.4.13
  fast-uri@>=3.0.0 <3.1.6: ^3.1.6
  hono@>=3.8.0 <4.13.5: ^4.13.5
  ip-address@<10.3.1: ^10.3.1
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  nanoid@<3.3.18: ^3.3.18
  postcss@>=8.0.0 <8.5.23: ^8.5.23
  qs@>=6.0.0 <6.16.0: ^6.16.0
  undici@>=7.0.0 <7.29.0: ^7.29.0
